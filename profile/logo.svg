<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 360" width="100%" height="100%">
  <defs>
    <!-- Flame Gradients -->
    <linearGradient id="flamePrimary" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF3E00" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="85%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>

    <linearGradient id="flameCore" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="60%" stop-color="#FFC700" />
      <stop offset="100%" stop-color="#FFF500" />
    </linearGradient>

    <linearGradient id="flameAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E00" />
      <stop offset="100%" stop-color="#E6005C" />
    </linearGradient>

    <!-- Metallic/Forge Dark Gradients -->
    <linearGradient id="forgeMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="forgeMetalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="forgeMetalTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Cyan/Electric Tech Accents -->
    <linearGradient id="techCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.45" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 84px;
      letter-spacing: 5px;
      fill: #0F172A;
    }

    .brand-subtitle {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 42px;
      letter-spacing: 21px;
      fill: #334155;
    }

    @media (prefers-color-scheme: dark) {
      .brand-title {
        fill: #F8FAFC !important;
      }
      .brand-subtitle {
        fill: #CBD5E1 !important;
      }
    }
  </style>

  <!-- Left Side: Expanded Icon Container (Center: X:210, Y:180) -->
  <g transform="translate(10, 0)">
    <!-- Ambient Glow Behind Flame -->
    <g filter="url(#flameGlow)">
      <ellipse cx="210" cy="165" rx="115" ry="95" fill="url(#flamePrimary)" opacity="0.2" />
    </g>

    <!-- Expanded Outer Hexagonal Frame Facets -->
    <polygon points="210,35 85,95 85,155 210,125" fill="url(#forgeMetalLeft)" opacity="0.9" />
    <polygon points="210,35 335,95 335,155 210,125" fill="url(#forgeMetalRight)" opacity="0.95" />
    <polygon points="85,205 85,265 210,325 210,245" fill="url(#forgeMetalLeft)" />
    <polygon points="335,205 335,265 210,325 210,245" fill="url(#forgeMetalRight)" />
    <polygon points="85,265 210,325 335,265 210,285" fill="#090D16" />

    <!-- Cyan & Flame Tech Accent Lines (Wider) -->
    <polyline points="85,95 210,35 335,95" fill="none" stroke="url(#techCyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <polyline points="85,265 210,325 335,265" fill="none" stroke="url(#flamePrimary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

    <!-- WIDER HEPHAESTUS LOGO MARK: 'H' Monogram + Anvil -->
    <!-- Left Pillar (Wider Stance) -->
    <path d="M115,115 L152,100 L152,250 L115,235 Z" fill="url(#forgeMetalLeft)" />
    <path d="M152,100 L167,108 L167,242 L152,250 Z" fill="url(#forgeMetalTop)" />

    <!-- Right Pillar (Wider Stance) -->
    <path d="M253,108 L268,100 L268,235 L253,242 Z" fill="url(#forgeMetalTop)" />
    <path d="M268,100 L305,115 L305,235 L268,250 Z" fill="url(#forgeMetalRight)" />

    <!-- Center Anvil Block (Expanded Crossbar) -->
    <polygon points="138,190 210,178 282,190 210,202" fill="url(#forgeMetalTop)" />
    <polygon points="115,188 138,190 138,200 126,202" fill="url(#forgeMetalLeft)" />
    <polygon points="138,190 210,202 282,190 282,212 210,226 138,212" fill="url(#forgeMetalLeft)" />
    <polygon points="155,212 210,226 265,212 273,240 210,252 147,240" fill="url(#forgeMetalRight)" />

    <!-- THE ETERNAL FORGE FLAME (Center Balanced) -->
    <path d="M210,50 C233,80 255,105 257,138 C259,170 233,185 210,185 C187,185 161,170 163,138 C165,105 187,80 210,50 Z" fill="url(#flamePrimary)" />
    <path d="M182,115 C165,130 154,145 160,162 C165,175 182,182 196,182 C178,175 174,155 182,140 C188,128 193,122 182,115 Z" fill="url(#flameAccent)" />
    <path d="M238,115 C255,130 266,145 260,162 C255,175 238,182 224,182 C242,175 246,155 238,140 C232,128 227,122 238,115 Z" fill="url(#flameAccent)" />
    <path d="M210,75 C224,98 238,118 236,142 C234,166 222,178 210,178 C198,178 186,166 184,142 C182,118 196,98 210,75 Z" fill="url(#flameCore)" />
    <path d="M210,105 C217,120 224,132 222,148 C220,162 215,170 210,170 C205,170 200,162 198,148 C196,132 203,120 210,105 Z" fill="#FFFFFF" opacity="0.92" />

    <!-- Spark Particles -->
    <circle cx="210" cy="40" r="3.5" fill="#FFD600" />
    <circle cx="230" cy="58" r="2.5" fill="#FF7A00" />
    <circle cx="190" cy="65" r="2" fill="#FFD600" />
    <circle cx="244" cy="85" r="2" fill="#FF3E00" />
    <circle cx="176" cy="90" r="1.5" fill="#FFA800" />
  </g>

  <!-- Right Side: Brand Text (Shifted Slightly Right for Better Spacing) -->
  <g transform="translate(410, 0)">
    <!-- Line 1: HEPHAESTUS -->
    <text x="0" y="165" class="brand-title">HEPHAESTUS</text>

    <!-- Line 2: STUDIO -->
    <text x="4" y="238" class="brand-subtitle">STUDIO</text>

    <!-- Decorative Accent Line -->
    <rect x="4" y="265" width="640" height="5" rx="2.5" fill="url(#flamePrimary)" />
    <rect x="4" y="265" width="140" height="5" rx="2.5" fill="url(#techCyan)" />
  </g>
</svg>